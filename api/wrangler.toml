# the guestbook + view counter api for modul0.dev. the site itself stays on
# github pages; this is the only part that stores anything.
name = "modul0-api"
main = "src/index.js"
compatibility_date = "2026-09-01"

# pages that may call the api from a browser (comma separated)
[vars]
ALLOWED_ORIGINS = "https://modul0.dev,http://localhost:4321"
# where a no-js guestbook post is sent back to
RETURN_URL = "https://modul0.dev/guestbook/"

[[d1_databases]]
binding = "DB"
database_name = "modul0"
# from `npx wrangler d1 create modul0`
database_id = "6b1a9a38-cfad-41b4-a68e-b13992bf7ab0"

# secrets (not in this file): ADMIN_TOKEN, deletes messages;
# IP_SALT, salts the ip hashes. set each with `npx wrangler secret put NAME`.

# per-ip rate limits (workers rate limiting: period is 10 or 60 seconds).
# namespace ids are just unique numbers for this account.
[[ratelimits]]
name = "WRITE_LIMIT" # posting a message
namespace_id = "1001"
simple = { limit = 3, period = 60 }

[[ratelimits]]
name = "READ_LIMIT" # loading messages
namespace_id = "1002"
simple = { limit = 30, period = 60 }

[[ratelimits]]
name = "VIEW_LIMIT" # the counter (one read per page load)
namespace_id = "1003"
simple = { limit = 20, period = 60 }

[[ratelimits]]
name = "ADMIN_LIMIT" # admin reads, deletes and wrong tokens
namespace_id = "1004"
simple = { limit = 10, period = 60 }
