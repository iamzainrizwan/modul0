name: api

# deploys the guestbook + view counter worker (api/) to cloudflare. the site
# itself is deployed by deploy.yml; this only runs when the worker changes.
on:
  push:
    branches: [main]
    paths: ['api/**']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    # skipped until the worker has been set up (see api/README.md)
    if: ${{ vars.PUBLIC_API != '' }}
    defaults:
      run:
        working-directory: api
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: api/package-lock.json
      # wrangler is pinned in api/package.json
      - run: npm ci
      - run: npx wrangler deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
