name: deploy

on:
  push:
    branches: [main]
  # daily, so the 404 page's snake keeps up with new commits
  schedule:
    - cron: '17 4 * * *'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        # history for the footer stamp and the terminal's `git log` (src/data/build.ts)
        with:
          fetch-depth: 20
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      # served at the root of the custom domain (github pages custom domain: modul0.dev)
      - run: npm run build
        env:
          SITE: https://modul0.dev
          # the guestbook + view counter worker (api/). a repo variable, not a
          # secret: it's a public url. unset, the guestbook shows as offline.
          PUBLIC_API: ${{ vars.PUBLIC_API }}
      # easter egg on the 404 page: a snake eating the contribution grid.
      # third-party action, so pinned to v3.5.0's commit
      - uses: Platane/snk/svg-only@d8f6715049803e982ee5ff501b6b9b7d5deeb09b
        with:
          github_user_name: iamzainrizwan
          outputs: dist/snake.svg?color_snake=#ffffff&color_dots=#161616,#3b2466,#5c3a9e,#7c4ddb,#a769ff
      # square corners only
      - run: sed -i -E 's/ r[xy]="[^"]*"//g' dist/snake.svg
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
